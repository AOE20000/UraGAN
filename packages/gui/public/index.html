<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UraGAN · AI 动画视频</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --line: #334155; --text: #e2e8f0; --dim: #94a3b8;
    --accent: #4f46e5; --accent2: #7c3aed; --ok: #22c55e; --err: #ef4444; --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 14px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; }
  header .meta { color: var(--dim); font-size: 13px; }
  header .spacer { flex: 1; }
  header button { padding: 7px 12px; font-size: 13px; }
  .toolbar input[type=file] { display: none; }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 20px; padding: 20px 24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
  .panel h2 { margin: 0 0 12px; font-size: 14px; color: var(--dim); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .panel h2 .hint { font-weight: 400; color: var(--dim); }
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .cd { background: #26334a; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: grab; display: flex; align-items: center; gap: 10px; transition: transform .12s, opacity .12s, border-color .12s; }
  .cd.dragging { opacity: .45; }
  .cd.drop-target { border-color: var(--accent); }
  .cd .idx { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 12px; flex: none; }
  .cd .name { flex: 1; }
  .cd .kind { font-size: 12px; color: var(--dim); }
  textarea { width: 100%; min-height: 220px; background: #0b1220; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; resize: vertical; }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  select { background: #0b1220; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  button.violet { background: var(--accent2); }
  .status { font-size: 13px; white-space: pre-wrap; }
  .ok { color: var(--ok); } .err { color: var(--err); } .warn { color: var(--warn); }
  video { width: 100%; border-radius: 10px; margin-top: 12px; background: #000; }
  .dim { color: var(--dim); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: #0b1220; border: 1px solid var(--line); border-radius: 16px; padding: 4px 10px; font-size: 12px; font-family: ui-monospace, monospace; }
  .comp { background: #26334a; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .comp .cid { font-family: ui-monospace, monospace; color: #a5b4fc; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .muted-box { background: #0b1220; border: 1px dashed var(--line); border-radius: 8px; padding: 10px; font-size: 12px; color: var(--dim); }
  .footer-note { font-size: 12px; color: var(--dim); margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>UraGAN</h1>
  <span class="meta" id="meta">—</span>
  <span class="spacer"></span>
  <label class="ghost" style="padding:7px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px;color:var(--text)">
    导入整体配置…
    <input type="file" id="configFile" accept=".json,.jsonc,.uragan,application/json">
  </label>
  <button class="ghost" onclick="exportConfig()">导出整体配置</button>
  <button onclick="assetsCheck()">资产体检</button>
  <span id="toolStatus" class="status"></span>
</header>

<main>
  <aside>
    <div class="panel">
      <h2>播放顺序 <span class="hint">（拖拽排序，自动保存）</span></h2>
      <div class="cards" id="cards"></div>
    </div>

    <div class="panel">
      <h2>单页编辑 <span class="hint">（导出 → 修改 → 覆盖）</span></h2>
      <textarea id="pageEditor" placeholder="点击页面卡片「编辑」→ 修改 JSON → 覆盖保存"></textarea>
      <div class="row">
        <button class="ghost" onclick="editTop()">编辑首页</button>
        <button onclick="savePage()">覆盖保存</button>
        <span id="pageStatus" class="status"></span>
      </div>
    </div>

    <div class="panel">
      <h2>组件 <span class="hint">（复制代码到页面 = 断开父子关系）</span></h2>
      <div id="comps"><div class="muted-box">（无组件）</div></div>
      <div class="row">
        <select id="compTarget"><option value="">先选目标页…</option></select>
        <span class="dim" id="compStatus"></span>
      </div>
    </div>
  </aside>

  <section>
    <div class="panel">
      <h2>文案填充 <span class="hint">（第 4/5 步）</span></h2>
      <textarea id="skeleton" placeholder="点击「导出文案框架（JSON）」或「导出文本框架（Markdown 表单）」→ 填写 → 导入填回"></textarea>
      <div class="row">
        <button onclick="exportSkeleton()">导出框架(JSON)</button>
        <button onclick="exportSkeletonMd()">导出文本框架(Markdown)</button>
        <button onclick="importSkeleton()">导入填回</button>
        <span id="copyStatus" class="status"></span>
      </div>
    </div>

    <div class="panel">
      <h2>共享池 <span class="hint">（$shared · dedup 投影）</span></h2>
      <div class="chips" id="sharedChips"><span class="dim">（空）</span></div>
    </div>

    <div class="panel">
      <h2>渲染视频 <span class="hint">（第 6 步）</span></h2>
      <div class="row">
        <button onclick="renderVideo()" id="renderBtn">渲染视频</button>
        <button class="ghost" onclick="loadVideoFromLast()">重播上次</button>
        <span id="renderStatus" class="status"></span>
      </div>
      <video id="video" controls></video>
    </div>
  </section>
</main>

<script>
let PROJ = null;
let dragFrom = null;

const $ = (id) => document.getElementById(id);
function setStatus(el, text, cls) { el.textContent = text || ''; el.className = 'status ' + (cls || ''); }

async function api(path, opts) {
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch { data = { ok: false, message: '响应非 JSON' }; }
  if (!res.ok || data.ok === false && data.errors === undefined) {
    throw new Error(data.message || (data.errors || []).map(e => e.message).join('；') || res.statusText);
  }
  return data;
}

/* ---------- 播放顺序 ---------- */
function renderCards() {
  const wrap = $('cards');
  wrap.innerHTML = '';
  PROJ.pages.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'cd';
    div.draggable = true;
    div.innerHTML = `<span class="idx">${i + 1}</span><span class="name">${esc(p.name)} <span class="dim">(${p.duration}s)</span></span><span class="kind">${p.kind}</span>`;
    div.addEventListener('dragstart', () => { div.classList.add('dragging'); dragFrom = p.pageId; });
    div.addEventListener('dragend', () => div.classList.remove('dragging'));
    div.addEventListener('dragover', (e) => { e.preventDefault(); div.classList.add('drop-target'); });
    div.addEventListener('dragleave', () => div.classList.remove('drop-target'));
    div.addEventListener('drop', (e) => {
      e.preventDefault();
      div.classList.remove('drop-target');
      if (!dragFrom || dragFrom === p.pageId) return;
      const from = PROJ.pages.findIndex(x => x.pageId === dragFrom);
      const to = PROJ.pages.findIndex(x => x.pageId === p.pageId);
      const [moved] = PROJ.pages.splice(from, 1);
      PROJ.pages.splice(to, 0, moved);
      const ids = PROJ.pages.map(x => x.pageId);
      api('/api/reorder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids }) })
        .then(() => { renderCards(); setStatus($('toolStatus'), '顺序已保存：' + ids.join(' → '), 'ok'); })
        .catch(e => setStatus($('toolStatus'), e.message, 'err'));
    });
    div.addEventListener('click', () => loadPage(p.pageId));
    wrap.appendChild(div);
  });
  // 组件面板的目标页下拉
  const sel = $('compTarget');
  const prev = sel.value;
  sel.innerHTML = '<option value="">选中目标页…</option>' + PROJ.pages.map(p => `<option value="${p.pageId}">${esc(p.name)}</option>`).join('');
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
}

function loadPage(pageId) {
  api('/api/page?id=' + encodeURIComponent(pageId))
    .then(p => { $('pageEditor').value = JSON.stringify(p, null, 2); setStatus($('pageStatus'), '已导出页 ' + pageId, 'ok'); })
    .catch(e => setStatus($('pageStatus'), e.message, 'err'));
}

/* ---------- 工程 / 整体配置 ---------- */
async function refresh() {
  try {
    PROJ = await api('/api/project');
    $('meta').textContent = `${PROJ.name} · ${PROJ.canvas.width}×${PROJ.canvas.height}@${PROJ.canvas.fps} · ${PROJ.pages.length} 页`;
    renderCards();
    loadShared();
    loadComps();
    setStatus($('toolStatus'), '', '');
  } catch (e) { setStatus($('toolStatus'), e.message, 'err'); }
}

$('configFile').addEventListener('change', async (ev) => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  if (!confirm('导入将覆盖当前工程全部页面，确定继续？')) return;
  const text = await f.text();
  try {
    const r = await api('/api/import', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ configText: text }) });
    setStatus($('toolStatus'), `✓ 已导入 ${r.pages} 个页面`, 'ok');
    refresh();
  } catch (e) { setStatus($('toolStatus'), e.message, 'err'); }
});

async function exportConfig() {
  try {
    const d = await api('/api/export');
    const blob = new Blob([JSON.stringify(d.config, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (PROJ.name || 'project') + '.config.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    setStatus($('toolStatus'), '✓ 已导出整体交换配置', 'ok');
  } catch (e) { setStatus($('toolStatus'), e.message, 'err'); }
}

async function loadShared() {
  try {
    const d = await api('/api/shared');
    const keys = Object.keys(d.shared || {});
    $('sharedChips').innerHTML = keys.length === 0
      ? '<span class="dim">（空，导出时自动去重生成）</span>'
      : keys.map(k => `<span class="chip">${esc(k)}</span>`).join('');
  } catch { $('sharedChips').innerHTML = '<span class="dim">—</span>'; }
}

/* ---------- 组件 ---------- */
async function loadComps() {
  try {
    const d = await api('/api/components');
    const list = d.components || [];
    $('comps').innerHTML = list.length === 0
      ? '<div class="muted-box">（无组件）</div>'
      : list.map(c => `<div class="comp" data-id="${esc(c.componentId)}">
          <span class="cid">${esc(c.componentId)}</span>
          <span>${esc(c.name)}</span>
          <span class="dim">$defs ${c.defs} 项${c.hasCode ? '' : ' · 无 code'}</span>
          <button class="violet" onclick="inlineComp('${esc(c.componentId)}')">复制代码到页面</button>
        </div>`).join('');
  } catch { $('comps').innerHTML = '<div class="muted-box">—</div>'; }
}

async function inlineComp(componentId) {
  const pageId = $('compTarget').value;
  if (!pageId) return alert('请先在上方选择要内联到的目标页');
  try {
    const r = await api('/api/component/inline', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pageId, componentId }) });
    const warns = (r.warnings || []).map(w => `\n⚠ [${w.code}] ${w.message}`).join('');
    setStatus($('compStatus'), `已内联到 ${pageId}${warns}`, 'ok');
    refresh();
  } catch (e) { setStatus($('compStatus'), e.message, 'err'); }
}

/* ---------- 单页 ---------- */
async function editTop() { if (PROJ?.pages?.length) loadPage(PROJ.pages[0].pageId); }

async function savePage() {
  try {
    await api('/api/page', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: $('pageEditor').value });
    setStatus($('pageStatus'), '✓ 页面已覆盖', 'ok');
    refresh();
  } catch (e) { setStatus($('pageStatus'), e.message, 'err'); }
}

/* ---------- 文案框架 ---------- */
async function exportSkeleton() {
  try {
    const s = await api('/api/skeleton');
    // api() 对纯 JSON 200 无 ok 字段：返回原始数据
    $('skeleton').value = JSON.stringify(s, null, 2);
    const n = (s.pages || []).reduce((a, p) => a + (p.items || []).length, 0);
    setStatus($('copyStatus'), `已导出 JSON 框架（${n} 个占位符）`, 'ok');
  } catch (e) { setStatus($('copyStatus'), e.message, 'err'); }
}

async function exportSkeletonMd() {
  try {
    const res = await fetch('/api/skeleton/md');
    if (!res.ok) throw new Error('导出失败：' + res.status);
    $('skeleton').value = await res.text();
    const n = ($('skeleton').value.match(/^\| c/gm) || []).length;
    setStatus($('copyStatus'), `已导出文本框架（${n} 个占位符，Markdown 表单）`, 'ok');
  } catch (e) { setStatus($('copyStatus'), e.message, 'err'); }
}

async function importSkeleton() {
  try {
    const res = await fetch('/api/skeleton', { method: 'POST', headers: { 'Content-Type': 'text/plain; charset=utf-8' }, body: $('skeleton').value });
    const data = await res.json().catch(() => ({ ok: false, message: '响应非 JSON' }));
    if (!res.ok) throw new Error(data.message || (data.errors || []).map(e => e.message).join('；'));
    setStatus($('copyStatus'), '✓ 文案填充完成', 'ok');
  } catch (e) { setStatus($('copyStatus'), e.message, 'err'); }
}

/* ---------- 资产体检 ---------- */
async function assetsCheck() {
  setStatus($('toolStatus'), '<span class="spinner"></span> 检查中…', '');
  try {
    const d = await api('/api/assets/check', { method: 'POST' });
    const issues = d.issues || [];
    if (issues.length === 0) { setStatus($('toolStatus'), '✓ 资产引用全部有效', 'ok'); return; }
    const lines = issues.map(i => `${i.severity === 'error' ? '✗' : '⚠'} [${i.code}] ${i.message}`).join('\n');
    setStatus($('toolStatus'), lines, d.ok ? 'warn' : 'err');
  } catch (e) { setStatus($('toolStatus'), '资产体检失败：' + e.message, 'err'); }
}

/* ---------- 渲染 ---------- */
async function renderVideo() {
  const btn = $('renderBtn');
  btn.disabled = true;
  $('video').removeAttribute('src');
  try {
    const { output } = await api('/api/render', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    setStatus($('renderStatus'), '<span class="spinner"></span> 渲染中…', '');
    const poll = setInterval(async () => {
      const s = await fetch('/api/render/status').then(r => r.json());
      if (!s.done) return;
      clearInterval(poll);
      btn.disabled = false;
      if (s.error) return setStatus($('renderStatus'), '✗ ' + s.error, 'err');
      setStatus($('renderStatus'), `✓ 渲染完成（${s.durationSeconds.toFixed(1)}s）`, 'ok');
      $('video').src = '/video/' + encodeURIComponent(s.output.split(/[\\/]/).pop());
      $('video').load();
      $('video').play();
    }, 1500);
  } catch (e) {
    btn.disabled = false;
    setStatus($('renderStatus'), e.message, 'err');
  }
}

async function loadVideoFromLast() {
  try {
    const s = await fetch('/api/render/status').then(r => r.json());
    if (!s.output) return setStatus($('renderStatus'), '尚无渲染产物', 'warn');
    $('video').src = '/video/' + encodeURIComponent(s.output.split(/[\\/]/).pop());
    $('video').load();
    $('video').play();
  } catch { /* 忽略 */ }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

refresh();
setInterval(() => {
  fetch('/api/render/status').then(r => r.json()).then(s => {
    if (s.running) { $('renderBtn').disabled = true; setStatus($('renderStatus'), '<span class="spinner"></span> 渲染中…', ''); }
  }).catch(() => {});
}, 3000);
</script>
</body>
</html>
